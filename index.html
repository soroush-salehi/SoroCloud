<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb"><meta name="description" content="A local file workspace prototype.">
<title>SoroCloud — Soro</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="css/main.css">
</head>
<body><div class="wrap"><header><div class="brand">◈ SoroCloud</div><span class="pill">LOCAL WORKSPACE</span></header><section class="hero"><h1>Your files,<br><span>one clear space.</span></h1><p>Select files to preview their names, types and sizes. Nothing is uploaded.</p><label class="upload">＋ Choose files<input id="files" type="file" multiple hidden></label></section><section class="panel"><div class="tools"><input id="search" placeholder="Search files…"><span id="count" class="muted">0 files</span></div><div id="items" class="items"><p class="empty">No files selected yet.</p></div></section><footer>Private by design: this demo keeps file data in your browser session only.</footer></div>

<script src="js/app.js" defer></script>
</body></html>
